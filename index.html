<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FUNKAURA | Custom Hand-Painted Streetwear (Est. 2026)</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Space Grotesk', sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            overflow-x: hidden;
        }

        /* Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            border-bottom: 2px solid #000;
            background: #fff;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 2px;
            text-decoration: none;
            color: #000;
        }

        nav a {
            margin: 0 15px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            transition: color 0.2s;
        }

        nav a:hover {
            color: #000;
            font-weight: 700;
        }

        .shop-now-btn {
            background-color: #000;
            color: #fff;
            padding: 10px 22px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 1px;
            transition: background 0.2s;
        }

        .shop-now-btn:hover {
            background-color: #333;
        }

        /* Hero Section */
        .hero {
            text-align: center;
            padding: 80px 20px 40px;
            background: #f9f9f9;
            border-bottom: 2px solid #000;
        }

        .hero h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 18px;
            color: #555;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Products Grid Section */
        .container {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
        }

        .section-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            text-align: center;
            letter-spacing: 1px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 40px;
        }

        .product-card {
            border: 2px solid #000;
            border-radius: 12px;
            padding: 20px;
            background: #fff;
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 8px 8px 0px #000;
        }

        /* FIXED IMAGE CONTAINER FOR FULL CENTERING */
        .product-image-container {
            width: 100%;
            height: 300px;
            background-color: #f4f4f4;
            border: 2px solid #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }

        .product-card img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* Ensures the entire image is displayed fully without cropping */
            object-position: center; /* Centers the image perfectly */
            background-color: #f9f9f9;
        }

        .product-info {
            text-align: center;
        }

        .product-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            color: #000;
        }

        .product-category {
            font-size: 14px;
            color: #666;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border: 2px solid #000;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }

        .btn-view {
            background-color: #fff;
            color: #000;
        }

        .btn-view:hover {
            background-color: #f0f0f0;
        }

        .btn-customize {
            background-color: #000;
            color: #fff;
        }

        .btn-customize:hover {
            background-color: #333;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            border-top: 2px solid #000;
            margin-top: 80px;
            background: #f9f9f9;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <a href="#" class="logo">FUNKAURA</a>
        <nav>
            <a href="#">HOME</a>
            <a href="#">PRODUCTS</a>
            <a href="#">CUSTOMIZATION</a>
            <a href="#">ABOUT</a>
            <a href="#">CONTACT</a>
        </nav>
        <a href="#products" class="shop-now-btn">SHOP NOW</a>
    </header>

    <!-- Hero Section -->
    <section class="hero">
        <h1>CUSTOM HAND-PAINTED STREETWEAR</h1>
        <p>One-of-a-kind doodle art painted on caps, t-shirts, sneakers, and accessories. Est. 2026.</p>
    </section>

    <!-- Products Section -->
    <div class="container" id="products">
        <h2 class="section-title">LATEST RELEASES</h2>
        <div class="product-grid" id="product-list">
            <!-- Dynamic products from CMS / GitHub will load here -->
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 FUNKAURA. All Rights Reserved. Hand-crafted Doodle Streetwear.</p>
    </footer>

    <!-- Script to fetch products from GitHub repository automatically -->
    <script>
        async function loadProducts() {
            const repo = 'mohammedbharmal2006/funkaura-website';
            const folder = 'content/products';
            const grid = document.getElementById('product-list');

            try {
                const response = await fetch(`https://api.github.com/repos/${repo}/contents/${folder}`);
                if (!response.ok) throw new Error('Could not fetch products');
                
                const files = await response.json();
                grid.innerHTML = '';

                for (let file of files) {
                    if (file.name.endsWith('.md')) {
                        const fileRes = await fetch(file.download_url);
                        const markdownText = await fileRes.text();
                        
                        // Simple parser for Netlify Decap CMS Markdown frontmatter
                        const titleMatch = markdownText.match(/title:\s*"?(.*?)"?$/m);
                        const categoryMatch = markdownText.match(/category:\s*"?(.*?)"?$/m);
                        const imageMatch = markdownText.match(/image:\s*"?(.*?)"?$/m);

                        const title = titleMatch ? titleMatch[1] : 'Custom Art Piece';
                        const category = categoryMatch ? categoryMatch[1] : 'Custom Order';
                        const image = imageMatch ? imageMatch[1] : '';

                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <div>
                                <div class="product-image-container">
                                    <img src="${image}" alt="${title}">
                                </div>
                                <div class="product-info">
                                    <div class="product-title">${title}</div>
                                    <div class="product-category">${category}</div>
                                </div>
                            </div>
                            <div class="product-actions">
                                <a href="#" class="btn btn-view">VIEW</a>
                                <a href="https://wa.me/?text=Hi,%20I%20want%20to%20order%20${encodeURIComponent(title)}" target="_blank" class="btn btn-customize">CUSTOMIZE</a>
                            </div>
                        `;
                        grid.appendChild(card);
                    }
                }
            } catch (error) {
                console.error('Error loading products:', error);
                grid.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">Products will appear here once added from the admin dashboard.</p>';
            }
        }

        loadProducts();
    </script>
</body>
</html>
