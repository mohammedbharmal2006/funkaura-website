backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "products"
    label: "Products"
    folder: "products"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Product Name", name: "title", widget: "string"}
      - {label: "Category", name: "category", widget: "select", options: ["T-Shirts", "Caps", "Bags", "Accessories"]}
      - {label: "Price (e.g. ₹599)", name: "price", widget: "string"}
      - {label: "Main Image", name: "image", widget: "image"}
      - {label: "Additional Gallery Images", name: "gallery", widget: "list", field: {label: "Image", name: "img_file", widget: "image"}, required: false}
      - {label: "Font Style", name: "font_style", widget: "select", options: ["Default", "Bold Serif", "Streetwear Graffiti"]}
      - {label: "Description", name: "body", widget: "markdown"}
